services:
  postgres:
    image: postgres:16-alpine
    container_name: voll-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voll}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-voll_plan}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-voll} -d $${POSTGRES_DB:-voll_plan}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  drachtio:
    image: drachtio/drachtio-server:latest
    container_name: drachtio
    network_mode: "host"
    command:
      - "drachtio"
      - "--contact"
      - "sip:*;transport=udp,tcp"
      - "--external-ip"
      - "${DRACHTIO_EXTERNAL_IP:-192.168.15.36}"
      - "--port"
      - "9022"
      - "--secret"
      - "${DRACHTIO_SECRET:-cymru}"
      - "--loglevel"
      - "info"
    restart: unless-stopped

  freeswitch:
    image: drachtio/drachtio-freeswitch-mrf:latest
    container_name: fs-lab
    network_mode: "host"
    volumes:
      - ./recordings:/recordings
    restart: unless-stopped

  whisper:
    build:
      context: ./whisper-service
      dockerfile: Dockerfile
    container_name: whisper-ai
    ports:
      - "8080:8080"
    environment:
      - WHISPER_MODEL_SIZE=small
      - WHISPER_DEVICE=auto
      - WHISPER_COMPUTE_TYPE=auto
      - WHISPER_MAX_BATCH_SIZE=8
      - WHISPER_BATCH_WINDOW_SEC=0.040
      - MODELS_DIR=/app/models
    volumes:
      # Modelos ONNX de biometria vocal (WeSpeaker CAM++ / ECAPA-TDNN) - não versionados
      - ./whisper-service/models:/app/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
