services:
  drachtio:
    image: drachtio/drachtio-server:latest
    container_name: drachtio
    network_mode: "host"
    command:
      - "drachtio"
      - "--contact"
      - "sip:*;transport=udp,tcp"
      - "--external-ip"
      - "192.168.15.36"
      - "--port"
      - "9022"
      - "--secret"
      - "cymru"
      - "--loglevel"
      - "info"
    restart: unless-stopped

  freeswitch:
    image: drachtio/drachtio-freeswitch-mrf:latest
    container_name: fs-lab
    network_mode: "host"
    volumes:
      - ./recordings:/recordings
    restart: unless-stopped
