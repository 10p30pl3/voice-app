services:
  drachtio:
    image: drachtio/drachtio-server:latest
    container_name: drachtio
    command:
      - "drachtio"
      - "--contact"
      - "sip:*;transport=udp,tcp"
      - "--external-ip"
      - "192.168.68.81"
      - "--port"
      - "9022"
      - "--secret"
      - "cymru"
      - "--loglevel"
      - "info"
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "9022:9022/tcp"
    restart: unless-stopped

  freeswitch:
    image: drachtio/drachtio-freeswitch-mrf:latest
    container_name: fs-lab
    ports:
      - "8021:8021/tcp"
      - "16384-16484:16384-16484/udp"
    volumes:
      - ./recordings:/recordings
    restart: unless-stopped

 
